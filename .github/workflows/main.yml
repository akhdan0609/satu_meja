
name: Deploy Satu Meja

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode website
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependency
        run: npm install

      - name: Build website
        run: npm run build -- --base=/satu_meja/

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload hasil build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Terbitkan website
        uses: actions/deploy-pages@v4

